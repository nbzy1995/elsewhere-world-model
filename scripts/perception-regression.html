<!doctype html><meta charset="utf-8"><title>Perception regression</title><style>body{margin:0;background:#111;color:white;font:16px system-ui}canvas{width:100%;display:block}p{padding:10px;margin:0}</style><p id="status">Loading</p><canvas id="view" width="1664" height="960"></canvas><script type="module">
import{warmup,selectObject,disposePerception}from'/src/perception.js';
const c=document.getElementById('view'),ctx=c.getContext('2d');
try{await warmup();window.ready=true;window.probe=async(file,point)=>{const im=new Image();im.src=file;await im.decode();ctx.drawImage(im,0,0,c.width,c.height);const result=await selectObject(c.toDataURL('image/jpeg',.92),point);const d=ctx.getImageData(0,0,c.width,c.height);for(let y=1;y<result.height-1;y++)for(let x=1;x<result.width-1;x++){const i=y*result.width+x;if(result.mask[i]&&(!result.mask[i-1]||!result.mask[i+1]||!result.mask[i-result.width]||!result.mask[i+result.width])){d.data[i*4]=206;d.data[i*4+1]=255;d.data[i*4+2]=99;}}ctx.putImageData(d,0,0);document.getElementById('status').textContent=result.label+' '+result.confidence.toFixed(3)+' '+Math.round(result.elapsedMs)+'ms';return{...result,mask:undefined,selectedPixels:result.mask.reduce((a,b)=>a+b,0)};};window.cleanup=disposePerception;}catch(e){window.error=e.stack;}
</script>
